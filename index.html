<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dongle&family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="left-side">
        <div class="left-side-container">
            <header>
                <h1 class="pacifico-regular">Etch-a-Sketch</h1>
                <p id="description" class="dongle-regular">Move your mouse over the tiles to draw on them! You can also change the grid
                    size and drawing style below.</p>
            </header>
            <div class="input-container">
                <input type="number" name="grid-size" id="grid-size" value="16" min="1" max="100" class="dongle-regular">
                <select name="draw-style" id="draw-style" class="dongle-regular">
                    <option value="color">Color</option>
                    <option value="solid">Solid</option>
                    <option value="opacity">Opacity</option>
                    <option value="color-and-opacity">Color and opacity</option>
                </select>
                <button id="generate-button" class="dongle-regular">Generate</button>
            </div>
        </div>
    </div>

    <div class="right-side">
        <div id="grid-container">

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
